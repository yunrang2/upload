name: Real Meat Reservation Reminders

on:
  schedule:
    # 한국시간 오전 7시부터 밤 11시 57분까지 5분 주기입니다.
    # 매시 정각의 GitHub Actions 혼잡 시간을 피해 02/07/12...분에 실행합니다.
    - cron: '2-57/5 0-14,22-23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: realmeat-reservation-reminders
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send authenticated reminder tick
        env:
          ENDPOINT: https://realmeat.vercel.app/api/reminders/tick
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          # GitHub가 발급한 단기 OIDC 토큰으로 발송기를 호출합니다.
          # 저장소에 Firebase 비밀키 또는 예약 개인정보를 저장하지 않습니다.
          audience = os.environ['ENDPOINT']
          issuer_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep = '&' if '?' in issuer_url else '?'
          issuer_url += sep + urllib.parse.urlencode({'audience': audience})
          request = urllib.request.Request(issuer_url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
              'Accept': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          request = urllib.request.Request(audience, data=b'{}', method='POST', headers={
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              payload = json.load(response)
          if not payload.get('ok'):
              raise RuntimeError('Reservation reminder job returned an error')
          print({key: payload.get(key) for key in ('bookings', 'due', 'devices', 'delivered', 'skipped', 'failed', 'reason')})
          PY
