name: Realmeat Owner Reservation Push Reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/realmeat-owner-reminders.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: realmeat-owner-reminders
  cancel-in-progress: false
jobs:
  notify-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Seed durable reservation notifications and check runtime delivery
        env:
          ENDPOINT: https://realmeat.vercel.app/api/reminders/tick
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          # 저장된 비밀키 대신 이 워크플로에만 허용된 단기 서명을 사용합니다.
          endpoint = os.environ['ENDPOINT']
          issuer = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          issuer += ('&' if '?' in issuer else '?') + urllib.parse.urlencode({'audience': endpoint})
          request = urllib.request.Request(issuer, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
              'Accept': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          request = urllib.request.Request(endpoint, data=b'{}', method='POST', headers={
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.load(response)
          if not result.get('ok'):
              raise RuntimeError('Notification watchdog failed')
          print({key: result.get(key) for key in ('ok', 'bookings', 'devices', 'skipped')})
          PY
